name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # Simulation-only: no credentials, no network. The LaLonde experiment
      # needs a download, so it is exercised by the Docker build instead.
      - run: python -m pytest tests/ -q
